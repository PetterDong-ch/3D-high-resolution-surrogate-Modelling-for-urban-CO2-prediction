[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "final-model-v40"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.12.0",
  "numpy==1.26.4",
  "pandas==3.0.3",
  "xarray==2026.4.0",
  "netCDF4==1.7.4",
  "matplotlib==3.10.8",
  "tqdm==4.67.3",
]

[tool.setuptools.packages.find]
where = ["src"]
