[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "final-model-task2-v3"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.12.0", "numpy==2.4.6", "pandas==3.0.3", "matplotlib==3.10.8"]

[project.scripts]
task2-v3 = "task2_v3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
